[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short -m \"not performance\""
qt_api = "pyqt6"

filterwarnings = [
    "ignore::DeprecationWarning"
]
markers = [
    "performance: Performance and benchmark regression tests for large data",
    "serial: Heavy real QThread or integration tests requiring low parallelism"
]


[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["F", "E9"]
ignore = [
    "E701", "E702", "E402",
    "F403", "F405",
    # F841 (unused local) still has ~68 hits; several look like dropped results
    # rather than dead assignments, so they need reading one by one before the
    # rule can be turned on.
    "F841",
]
# F401 and F811 are now enforced (test_static_analysis gates on `ruff check`).
# Modules that exist purely to re-export declare __all__ rather than being
# exempted; F811 catches duplicate test names that silently shadow each other.



