[project]
name = "picoripi"
requires-python = ">=3.10"
# Version lives only in utils/constants.py.
dynamic = ["version"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short -m \"not performance\" --timeout=90"
qt_api = "pyqt6"

filterwarnings = [
    "ignore::DeprecationWarning"
]
markers = [
    "performance: Performance and benchmark regression tests for large data",
    "serial: Heavy real QThread or integration tests requiring low parallelism"
]


[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
# S110/S112: a broad `except` that only passes or continues must say what it swallowed (log_debug at least).
select = ["F", "E9", "S110", "S112"]
ignore = [
    "E701", "E702", "E402",
    "F403", "F405",
]
# F401, F811 and F841 are enforced (test_static_analysis gates on `ruff check`).
# Modules that exist purely to re-export declare __all__ rather than being
# exempted; F811 catches duplicate test names that silently shadow each other.

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S110", "S112"]
"scripts/**" = ["S110", "S112"]
"tools/i18n-translate/**" = ["S110", "S112"]

