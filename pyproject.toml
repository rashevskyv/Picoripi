[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short -m \"not performance\""
qt_api = "pyqt6"

filterwarnings = [
    "ignore::DeprecationWarning"
]
markers = [
    "performance: Performance and benchmark regression tests for large data",
    "serial: Heavy real QThread or integration tests requiring low parallelism"
]


[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["F", "E9"]
ignore = [
    "E701", "E702", "E402",
    "F401", "F403", "F405", "F841", "F811"
]



